<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Linear Gradients for subtle 3D metallic depth matching client original -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A75FF" />
      <stop offset="100%" stop-color="#0055CC" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1A40" />
      <stop offset="100%" stop-color="#CC0022" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D95A" />
      <stop offset="100%" stop-color="#008C3E" />
    </linearGradient>
  </defs>

