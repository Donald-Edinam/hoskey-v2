    d="M 38 66 L 82 66 C 85.3 66 88 68.7 88 72 L 88 84 C 88 87.3 85.3 90 82 90 L 38 90 Z"
    fill="url(#greenGrad)"
  />

  <!-- Red Rounded Play Button Triangle (Center Right of H) -->
