<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" fill="none">
  <!-- Dark background container for Apple Home Screen icon -->
  <rect width="180" height="180" rx="40" fill="#0D0C0B" />

  <g transform="translate(15, 15)">
    <defs>
      <linearGradient id="appleBlue" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#1A75FF" />
        <stop offset="100%" stop-color="#0055CC" />
      </linearGradient>
      <linearGradient id="appleRed" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FF1A40" />
        <stop offset="100%" stop-color="#CC0022" />
      </linearGradient>
      <linearGradient id="appleGreen" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#00D95A" />
        <stop offset="100%" stop-color="#008C3E" />
      </linearGradient>
    </defs>

    <!-- Blue Stem -->
    <path
      d="M 24 15 C 20.7 15 18 17.7 18 21 L 18 129 C 18 132.3 20.7 135 24 135 L 48 135 C 51.3 135 54 132.3 54 129 L 54 81 L 78 81 C 81.3 81 84 78.3 84 75 L 84 57 C 84 53.7 81.3 51 78 51 L 54 51 L 54 21 C 54 17.7 51.3 15 48 15 Z"
      fill="url(#appleBlue)"
    />

    <!-- Green Base -->
    <path
      d="M 57 99 L 123 99 C 128 99 132 103 132 108 L 132 126 C 132 131 128 135 123 135 L 57 135 Z"
      fill="url(#appleGreen)"
    />

    <!-- Red Play Button -->
    <path
      d="M 57 27.75 C 57 22.5 63 19.5 67.5 22.5 L 127.5 65.25 C 132 68.25 132 75.75 127.5 78.75 L 67.5 121.5 C 63 124.5 57 121.5 57 116.25 Z"
      fill="url(#appleRed)"
    />
  </g>
</svg>
